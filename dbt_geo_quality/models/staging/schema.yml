version: 2

models:
  - name: stg_dataset_metadata
    description: >
      Documentation-only placeholder. dbt Core does not expose native shapefile metadata readers
      under the "library/plugin only, no custom SQL or Python" rule used in this ISO assessment.
  - name: stg_estacoes
    description: >
      Documentation-only placeholder for the stations layer. The real comparison is executed by the
      library-based evidence script because native dbt ingestion of shapefiles would require SQL or
      a custom Python plugin.
  - name: stg_ferrovias
    description: >
      Documentation-only placeholder for the railway layer. The real comparison is executed by the
      library-based evidence script because native dbt ingestion of shapefiles would require SQL or
      a custom Python plugin.
