# Local profile used by the dbt project created for the ISO 19157 capability check.
dbt_geo_quality:
  # Keep a single development target for reproducible local runs.
  target: dev
  outputs:
    dev:
      # Use the DuckDB adapter because it is the simplest official local adapter for dbt Core.
      type: duckdb
      # Persist the database file inside the project folder so every run uses the same path.
      path: "./dbt_geo_quality/data/geo_quality.duckdb"
      # Keep the default schema explicit to make terminal output easier to read.
      schema: main
      # Run single-threaded to keep logs deterministic in out.txt.
      threads: 1
      # Load DuckDB's spatial extension to show the closest geospatial support available via extension.
      extensions:
        - spatial
